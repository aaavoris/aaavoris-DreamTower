/* ---------- Theme ---------- */
function isDark(){
  var t=document.documentElement.getAttribute('data-theme');
  if(t) return t==='dark';
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function cssColor(name){return new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue(name).trim())}
function applyTheme(){
  var bg=cssColor('--scene-bg');
  scene.background=bg;
  scene.fog=new THREE.Fog(bg,110,260);
  groundMat.color.copy(cssColor('--scene-ground'));
  roadMat.color.copy(cssColor('--scene-road'));
  var pc=cssColor('--scene-pad'); themed.pad.forEach(function(m){m.color.copy(pc)});
  var d=isDark();
  hemi.intensity=d?0.42:0.75; sun.intensity=d?0.45:0.8;
  hemi.color.set(d?0x6b7f94:0xffffff);
}
applyTheme();
if(window.matchMedia){
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener) mq.addEventListener('change',applyTheme);
}
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- Labels and chips ---------- */
var labelsEl=document.getElementById('labels'), rail=document.getElementById('rail');
var pins={}, chips={};
DATA.forEach(function(b){
  var p=document.createElement('button'); p.type='button'; p.className='pin'; p.setAttribute('data-id',b.id);
  p.innerHTML='<i style="background:'+b.color+'"></i>'+b.name;
  p.addEventListener('click',function(){select(b.id)});
  labelsEl.appendChild(p); pins[b.id]=p;
  var c=document.createElement('button'); c.type='button'; c.className='chip'; c.setAttribute('aria-pressed','false');
  c.innerHTML='<i style="background:'+b.color+'"></i>'+b.name;
  c.addEventListener('click',function(){select(b.id)});
  rail.appendChild(c); chips[b.id]=c;
});
var tmpV=new THREE.Vector3();
function updateLabels(){
  var w=stage.clientWidth,h=stage.clientHeight;
  DATA.forEach(function(b){
    tmpV.set(b.pos[0],b.h+5,b.pos[1]).project(camera);
    var p=pins[b.id];
    if(tmpV.z>1||tmpV.z<-1){p.style.display='none';return}
    p.style.display='';
    var x=(tmpV.x*0.5+0.5)*w, y=(-tmpV.y*0.5+0.5)*h;
    p.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) translate(-50%,-100%)';
  });
}

/* ---------- Panel ---------- */
var panel=document.getElementById('panel');
function niceStep(max){
  var raw=max/4, mag=Math.pow(10,Math.floor(Math.log10(raw))), c=[1,2,5,10];
  for(var i=0;i<c.length;i++){ if(c[i]*mag>=raw) return c[i]*mag }
  return 10*mag;
}
function chartSVG(b){
  var W=320,H=165,L=34,R=6,T=10,Bm=22, pw=W-L-R, ph=H-T-Bm;
  var mx=Math.max.apply(null,b.mRev.concat(b.mExp));
  var step=niceStep(mx), top=step*Math.ceil(mx/step);
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Monthly revenue and expenses for '+b.name+', May to October">';
  for(var k=0;k*step<=top+1e-9;k++){
    var v=k*step, y=T+ph-(v/top)*ph;
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(L-5)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--font-mono)">'+(step<1?v.toFixed(1):v.toFixed(0))+'</text>';
  }
  var gw=pw/MONTHS.length, bw=gw*0.3;
  MONTHS.forEach(function(m,i){
    var gx=L+i*gw+gw/2, hr=b.mRev[i]/top*ph, he=b.mExp[i]/top*ph;
    s+='<rect x="'+(gx-bw-1).toFixed(1)+'" y="'+(T+ph-hr).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hr.toFixed(1)+'" rx="2" fill="var(--accent)"><title>'+m+' revenue $'+b.mRev[i].toFixed(2)+'M</title></rect>';
    s+='<rect x="'+(gx+1).toFixed(1)+'" y="'+(T+ph-he).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+he.toFixed(1)+'" rx="2" fill="var(--warn)"><title>'+m+' expenses $'+b.mExp[i].toFixed(2)+'M</title></rect>';
    s+='<text x="'+gx.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--font-body)">'+m+'</text>';
  });
  return s+'</svg>';
}
function renderPanel(b){
  var pc=b.profit>=0?'good':'bad';
  panel.innerHTML=
   '<div class="p-head"><span class="tag"><i style="background:'+b.color+'"></i>'+b.sector+'</span><button class="x" type="button" id="pClose" aria-label="Close panel">&times;</button></div>'+
   '<h2>'+b.name+'</h2><p class="desc">'+b.desc+'</p>'+
   '<div class="kpis">'+
     '<div class="kpi"><span>Revenue / year</span><b>'+money(b.rev)+'</b></div>'+
     '<div class="kpi"><span>Expenses / year</span><b>'+money(b.exp)+'</b></div>'+
     '<div class="kpi"><span>Net profit</span><b class="'+pc+'">'+money(b.profit)+'</b></div>'+
     '<div class="kpi"><span>Profit margin</span><b class="'+pc+'">'+b.margin.toFixed(1)+'%</b></div>'+
   '</div>'+
   '<div class="chartbox"><div class="chart-h"><span>Monthly, $ millions</span><span class="legend"><span><i style="background:var(--accent)"></i>Revenue</span><span><i style="background:var(--warn)"></i>Expenses</span></span></div>'+chartSVG(b)+'</div>'+
   '<dl class="facts"><dt>Business model</dt><dd>'+b.role+'</dd><dt>Employees</dt><dd>'+b.staff.toLocaleString('en-US')+'</dd><dt>'+b.extra[0]+'</dt><dd>'+b.extra[1]+'</dd><dt>Revenue per employee</dt><dd>$'+Math.round(b.rev*1e6/b.staff/1000)+'k</dd></dl>'+
   '<div class="note"><b>Analyst note</b><p>'+b.note+'</p></div>'+
   '<p class="fine">Sample figures created for a university project.</p>';
  panel.hidden=false; panel.scrollTop=0;
}

/* ---------- Selection, hover, camera tween ---------- */
var selected=null, hovered=null, tween=null;
function glow(id,v){
  var g=groups[id]; if(!g) return;
  var col=new THREE.Color(byId[id].color);
  g.traverse(function(o){
    if(!o.isMesh) return;
    [].concat(o.material).forEach(function(m){ if(m.emissive){m.emissive.copy(col);m.emissiveIntensity=v} });
  });
}
function refreshGlow(){
  DATA.forEach(function(b){
    glow(b.id,b.id===selected?0.4:(b.id===hovered?0.22:0));
    outlines[b.id].visible=(b.id===selected||b.id===hovered);
    pins[b.id].classList.toggle('on',b.id===selected);
    chips[b.id].setAttribute('aria-pressed',b.id===selected?'true':'false');
  });
}
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function flyTo(pos,tgt){
  if(reduce){camera.position.copy(pos);controls.target.copy(tgt);controls.update();return}
  tween={t0:performance.now(),dur:900,fp:camera.position.clone(),tp:pos.clone(),ft:controls.target.clone(),tt:tgt.clone()};
}
function isNarrow(){return window.matchMedia('(max-width: 720px)').matches}
function select(id){
  var b=byId[id]; selected=id; refreshGlow(); renderPanel(b);
  var tgt=new THREE.Vector3(b.pos[0],b.h*0.45,b.pos[1]);
  var dir=camera.position.clone().sub(controls.target); dir.y=Math.max(dir.y,dir.length()*0.35); dir.normalize();
  var dist=Math.min(Math.max(b.h*1.6,36),100)*(isNarrow()?1.2:1);
  if(isNarrow()) tgt.y-=dist*0.16;
  flyTo(tgt.clone().add(dir.multiplyScalar(dist)),tgt);
  if(chips[id].scrollIntoView) chips[id].scrollIntoView({block:'nearest',inline:'center'});
  hideHint();
}
function deselect(){selected=null;panel.hidden=true;refreshGlow()}
function resetView(){deselect();flyTo(HOME_POS.clone(),HOME_TGT.clone())}
panel.addEventListener('click',function(e){ if(e.target.closest&&e.target.closest('#pClose')) deselect() });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') deselect() });
document.getElementById('btnReset').addEventListener('click',resetView);
var spin=document.getElementById('btnSpin');
spin.addEventListener('click',function(){
  controls.autoRotate=!controls.autoRotate; spin.setAttribute('aria-pressed',controls.autoRotate?'true':'false');
});
var hint=document.getElementById('hint');
function hideHint(){hint.classList.add('gone')}

/* picking */
var ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pick(ev){
  var r=renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  var hit=ray.intersectObjects(pickables,false);
  return hit.length?hit[0].object.userData.id:null;
}
var down=null, dom=renderer.domElement;
dom.addEventListener('pointerdown',function(e){down={x:e.clientX,y:e.clientY,t:performance.now()};tween=null;hideHint()});
dom.addEventListener('pointerup',function(e){
  if(!down) return;
  var moved=Math.hypot(e.clientX-down.x,e.clientY-down.y), dt=performance.now()-down.t; down=null;
  if(moved<6&&dt<600){ var id=pick(e); if(id) select(id); else if(selected) deselect(); }
});
var hoverQueued=false;
dom.addEventListener('pointermove',function(e){
  if(e.pointerType==='touch'||down||hoverQueued) return;
  hoverQueued=true;
  requestAnimationFrame(function(){
    hoverQueued=false; var id=pick(e);
    if(id!==hovered){hovered=id;dom.style.cursor=id?'pointer':'grab';refreshGlow()}
  });
});
dom.addEventListener('wheel',hideHint,{passive:true});

/* resize */
function resize(){
  var w=stage.clientWidth,h=stage.clientHeight; if(!w||!h) return;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
if(window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize',resize);
resize();

/* loop */
var last=performance.now();
function ease(k){return k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}
function frame(now){
  var dt=Math.min((now-last)/1000,0.05); last=now;
  if(tween){
    var k=Math.min((now-tween.t0)/tween.dur,1), e=ease(k);
    camera.position.lerpVectors(tween.fp,tween.tp,e);
    controls.target.lerpVectors(tween.ft,tween.tt,e);
    if(k>=1) tween=null;
  }
  if(!reduce){
    rotors.forEach(function(r){r.rotation.z+=dt*1.6});
    cars.forEach(function(c){
      var p=c.m.position;
      if(c.axis==='x'){p.x+=c.dir*c.speed*dt; if(p.x>62)p.x=-62; if(p.x<-62)p.x=62}
      else {p.z+=c.dir*c.speed*dt; if(p.z>62)p.z=-62; if(p.z<-62)p.z=62}
    });
  }
  controls.update();
  renderer.render(scene,camera);
  updateLabels();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

</body></html>
